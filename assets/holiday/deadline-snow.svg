<svg width="300" height="256" viewBox="0 0 300 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .snowflake { transform: translateY(var(--y)); }

    @media (prefers-reduced-motion: no-preference) {
      .snowflake { animation: fall var(--fall) var(--fall-phase) linear infinite; }
      .drifting { animation: drift var(--drift) var(--drift-phase) ease-in-out infinite; }
    }

    @keyframes fall {
      from { transform: translateY(-4px); }
      to { transform: translateY(260px); }
    }

    @keyframes drift {
      0%, 100% { transform: translateX(0); }
      24% { transform: translateX(var(--first-sway)); }
      69% { transform: translateX(var(--second-sway)); }
    }
  </style>
